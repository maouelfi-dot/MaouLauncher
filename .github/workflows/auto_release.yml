name: Auto Release APK


# [Maou] Setiap push ke main / cabang maou-* otomatis build APK lalu upload ke GitHub Release
# [Maou] Rilis RESMI (bukan pre-release) dengan tag v<versi> dari ZalithLauncher/gradle.properties (mis. v2.10.16).
# Jika tag itu sudah pernah dipublikasikan (immutable, tidak bisa dipakai ulang), push berikutnya memakai v<versi>-b<nomor>.
on:
  push:
    branches:
      - main
      - master
      - 'maou-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  Upload-to-Release:
    needs: Build
    runs-on: ubuntu-latest
    if: success()
    steps:
      #[Maou] dibutuhkan agar RELEASE_NOTES.md ada di runner (sebelumnya: ENOENT)
      - name: Checkout (catatan rilis)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RELEASE_NOTES.md
            ZalithLauncher/gradle.properties
          sparse-checkout-cone-mode: false

      - name: Download Files
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Collect APKs
        run: |
          mkdir -p ./apks
          find ./artifacts -name "*.apk" -type f -exec cp {} ./apks/ \;
          echo "Found $(ls ./apks/ | wc -l) APK file(s)"

      - name: Decide tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^launcher_version_name=' ZalithLauncher/gradle.properties | cut -d= -f2 | tr -d '\r ')
          TAG="v${VER}"
          STATE=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' 2>/dev/null || echo none)
          if [ "$STATE" = "true" ]; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes   # draft sisa percobaan sebelumnya
          elif [ "$STATE" = "false" ]; then
            TAG="v${VER}-b${{ github.run_number }}"                          # v<versi> sudah terbit: tag tidak bisa dipakai ulang
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Tag rilis: $TAG"

      - name: Upload To Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Maou Launcher ${{ steps.tag.outputs.ver }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          #[Maou] repo memakai "immutable releases": aset hanya boleh diunggah saat masih draft, lalu baru dipublikasikan
          draft: true
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: ./apks/*.apk
          fail_on_unmatched_files: true

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
