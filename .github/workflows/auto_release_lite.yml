name: Auto Release APK Lite

# [Maou] Versi LITE: hanya arm64-v8a (64-bit ARM) dan hanya runtime Java 21 -> APK jauh lebih kecil.
# Dijalankan otomatis oleh apply-patch.yml (workflow_dispatch), atau tiap push ke main (selain file .patch / .md).
# Memakai penanda -Darch=arm64 -DjreOnly=21 yang dibaca ZalithLauncher/build.gradle.kts (lihat maou-lite-java21.patch).
on:
  push:
    branches: [main]
    paths-ignore: ['*.patch', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maou-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build-Lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked || cargo install cargo-ndk
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target list --installed
          cargo ndk --version

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Pasang NDK 25.2.9519653
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/25.2.9519653" >> $GITHUB_ENV
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" >/dev/null
          ls "$SDK/ndk/25.2.9519653" | head

      - name: Build APK Lite (arm64-v8a + Java 21)
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew -Darch=arm64 -DjreOnly=21 :ZalithLauncher:assembleRelease --stacktrace

      - name: Kumpulkan APK
        run: |
          mkdir -p apks
          find ZalithLauncher/build/outputs/apk/release -name "*.apk" -type f -exec cp {} apks/ \;
          ls -lh apks
          [ "$(ls apks | wc -l)" -ge 1 ] || { echo "APK tidak ditemukan"; exit 1; }

      - name: Simpan artefak
        uses: actions/upload-artifact@v4
        with:
          name: Maou-Lite-arm64-java21
          path: apks/*.apk

      - name: Tentukan tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^launcher_version_name=' ZalithLauncher/gradle.properties | cut -d= -f2 | tr -d '\r ')
          TAG="v${VER}-lite"
          STATE=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' 2>/dev/null || echo none)
          if [ "$STATE" = "true" ]; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          elif [ "$STATE" = "false" ]; then
            TAG="v${VER}-lite-b${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Upload ke Release (draft lalu terbit)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Maou Launcher ${{ steps.tag.outputs.ver }} Lite (arm64, Java 21)
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: false
          draft: true
          body: |
            Versi Lite: hanya arm64-v8a dan hanya Java 21. Versi Minecraft lama yang butuh Java 8/17 tidak didukung di versi ini.
          files: apks/*.apk
          fail_on_unmatched_files: true

      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest=false
