name: Auto Release APK

# [Maou] Setiap push ke main / cabang maou-*: build APK Release (arm + arm64 saja), lalu langsung
# dirilis di GitHub Releases dengan tag v<versi> (versi dibaca dari ZalithLauncher/gradle.properties).
# Push lagi dengan versi yang sama = APK di rilis itu ditimpa. Naikkan launcher_version_name untuk rilis baru.
on:
  push:
    branches:
      - main
      - master
      - 'maou-*'
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  Upload-to-Release:
    needs: Build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        id: ver
        run: |
          version=$(grep -E '^launcher_version_name=' ZalithLauncher/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versi: $version"

      - name: Download Files
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Collect APKs
        run: |
          mkdir -p ./apks
          find ./artifacts -name "*.apk" -type f -exec cp {} ./apks/ \;
          ls -la ./apks/
          echo "Found $(ls ./apks/ | wc -l) APK file(s)"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Maou Launcher ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            **Pilih APK yang sesuai HP kamu:**
            - `arm64` -> HP 64-bit (hampir semua HP sekarang). Pilih yang ini kalau ragu.
            - `arm` -> HP 32-bit lama.

            Unduh cukup SATU APK saja. Cek ukuran file hasil unduhan sama dengan yang tertera di daftar Assets sebelum dipasang.
          files: ./apks/*.apk
          fail_on_unmatched_files: true
