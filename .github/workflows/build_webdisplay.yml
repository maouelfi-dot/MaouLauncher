name: Build Maou WebDisplay mod

# Push yang mengubah folder MaouWebDisplay/ membangun jar mod lalu merilisnya (tag mod-v<versi>).
on:
  push:
    branches: [ main ]
    paths:
      - 'MaouWebDisplay/**'
      - '.github/workflows/build_webdisplay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-webdisplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          build-root-directory: MaouWebDisplay

      - name: Build
        working-directory: MaouWebDisplay
        run: gradle build --no-daemon

      - name: Baca versi
        id: ver
        run: echo "version=$(grep -E '^mod_version=' MaouWebDisplay/gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Siapkan jar
        run: |
          mkdir -p out
          cp MaouWebDisplay/build/libs/maou-mcef-android-*.jar out/
          rm -f out/*-sources.jar out/*-dev.jar
          ls -la out

      - name: Rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-v${{ steps.ver.outputs.version }}
          name: Maou MCEF Android ${{ steps.ver.outputs.version }} (mod WebDisplays untuk Android)
          make_latest: false
          files: out/*.jar
          body: |
            Pengganti MCEF untuk Android. Taruh jar ini di folder mods bersama WebDisplays 1.2.24 (Fabric 1.21.1 + Fabric API)
            dan pakai Maou Launcher 2.10.13 atau lebih baru. Jangan pasang MCEF asli bersamaan.
