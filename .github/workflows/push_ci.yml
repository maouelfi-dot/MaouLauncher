name: Build CI

# [Maou] APK Debug TIDAK lagi dibuat otomatis di setiap push (ukurannya besar dan boros kuota unduh).
# APK yang dipakai sehari-hari selalu versi Release dari auto_release.yml. Debug hanya kalau dijalankan manual.
on:
  workflow_dispatch:

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Debug
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
