name: Build Maou Extras
on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/maou-extras/**'
      - '.github/workflows/build_chunk_tuner.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        working-directory: mods/maou-extras
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maou-extras
          path: mods/maou-extras/build/libs/maou-extras-*.jar
